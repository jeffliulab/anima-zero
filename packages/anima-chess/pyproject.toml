[build-system]
requires = ["setuptools>=77"]   # >=77: PEP 639 的 SPDX license 写法
build-backend = "setuptools.build_meta"

[project]
name = "anima-chess"
dynamic = ["version"]
description = "Chess rules for ANIMA — legal moves, check, checkmate and draws. Rules only, no engine."
readme = "README.md"
license = "MIT"
# MIT requires the licence and copyright notice to travel with every copy, so the text
# ships inside the distribution rather than only being named in the metadata.
# MIT 要求许可与版权声明随每一份副本一起走，所以正文要**装进包里**，不能只在元数据里报个名字。
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jeff Liu Lab", email = "contact@jeffliulab.com" }]
keywords = ["chess", "move-generation", "bitboard", "perft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
# No runtime dependencies, on purpose: this package exists to remove a dependency, so
# adding any would be self-defeating. / 有意零运行时依赖：这个包的存在就是为了**去掉**一个依赖，
# 再引入新的就本末倒置了。
dependencies = []

[project.optional-dependencies]
# ruff has an upper bound for the same reason as in the repository root: an unpinned
# linter means CI can turn red without a code change.
# ruff 加上界，理由和仓库根一样：linter 不钉版本，CI 会在代码没动的情况下变红。
dev = ["pytest>=8.0", "ruff>=0.15,<0.17"]

[tool.setuptools.dynamic]
version = { attr = "anima_chess._version.__version__" }

[tool.setuptools]
packages = ["anima_chess"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ⛔ Stated, not inherited. This package has its own pyproject, so ruff reads this file and
# not the repository root's — a rule set fixed only at the root would have left this one
# still following the tool's default-of-the-day. ruff 0.16.0 widened those defaults and
# turned CI red on code nobody had touched.
#
# ⛔ 写出来，不继承。这个包有自己的 pyproject，ruff 读的是这份、不是仓库根那份——只在根上钉死规则集，
#    这里仍然会跟着工具"今天的默认值"走。ruff 0.16.0 放宽了那些默认值，于是没人碰过的代码让 CI 变红。
select = ["E4", "E7", "E9", "F"]
