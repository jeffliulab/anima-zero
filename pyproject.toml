[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anima"
version = "0.1.0"
description = "ANIMA — the brain of an embodied robot: an object standard + registry + a generic agent loop. Connects to one object at a time and operates it through vision-capable LLMs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Jeff Liu Lab", email = "contact@jeffliulab.com" },
]
keywords = [
    "embodied-ai",
    "agent",
    "llm-tool-use",
    "object-standard",
    "vision-language-action",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.69",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=10",
    "pydantic>=2.6",
    "pydantic-settings>=2.6",  # 中央配置 Settings(BaseSettings)：类型校验+env/.env 读取(v0.8 起;此前是 mcp 的传递依赖,直接 import 必须显式声明)
    "python-dotenv>=1.0",
    "httpx>=0.27",      # 世界客户端(RemoteWorld)直接用;之前仅靠 anthropic/fastapi 传递依赖,现显式声明
    "mcp>=1.2",         # 官方 MCP SDK：大脑作 MCP host/client 连世界/服务(接口采标 MCP);先钉 v1.x
    "chess>=1.10",      # python-chess: 脑侧已不用;同 venv 运行的 sim-chess 世界与引擎 service 需要
    "langgraph>=1.0",   # 主循环骨架(StateGraph);节点内脏仍是自有 LLM 层/MCP 桥,不用 LangChain 抽象
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",      # 自动化回归测试(主循环/挂载/统一日志/链路)
]

[project.urls]
Homepage = "https://github.com/jeffliulab/anima-zero"

# 扁平 src/ 映射成 anima 包(不建 src/anima);llm/ 是子包
[tool.setuptools]
package-dir = { "anima" = "src" }
packages = ["anima", "anima.core", "anima.clients", "anima.session", "anima.llm", "anima.presentation"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"       # 把 .pytest_cache 收进 .cache/
testpaths = ["tests"]
pythonpath = ["."]                # 仓库根进 sys.path：services.boardgame_engine / src.* 等顶层 import 靠它

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".cache/ruff"         # 把 .ruff_cache 收进 .cache/
