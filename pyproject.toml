[build-system]
requires = ["setuptools>=77"]   # >=77: PEP 639 的 SPDX license 写法
build-backend = "setuptools.build_meta"

[project]
# The distribution is `anima-zero`; the import is `anima`.
# Not a mismatch by choice — `anima` on PyPI is registered by someone else (a project with
# no releases, which is why the JSON API 404s for it and the simple index does not).
# The repository is called anima-zero too, so this is the more consistent name anyway.
# Distribution and import names differing is ordinary in this ecosystem: `pip install
# python-chess` gives you `import chess`.
# 发行名是 `anima-zero`，导入名是 `anima`。
# 不是有意错位——PyPI 上的 `anima` 已被别人注册（一个没发过任何版本的项目，所以 JSON API 对它
# 是 404、而 simple index 不是）。仓库本来也叫 anima-zero，所以这个名字反而更一致。
# 发行名与导入名不同在这个生态里很常见：`pip install python-chess` 装到的是 `import chess`。
name = "anima-zero"
# Single source of truth is src/_version.py (read statically, no import at build time).
# 版本号的单一来源是 src/_version.py（静态读取，构建期不 import）。
dynamic = ["version"]
description = "ANIMA — the brain of an embodied robot: an object standard + registry + a generic agent loop. Connects to one object at a time and operates it through vision-capable LLMs."
readme = "README.md"
# SPDX expression, not `{ file = "LICENSE" }` — the file form copies the entire licence
# text into the package metadata, which is why `pip show` used to print all 661 lines of
# the AGPL as the "License" field.
# 用 SPDX 表达式而不是 `{ file = "LICENSE" }`——文件形式会把整篇协议正文抄进包元数据，
# 这就是过去 `pip show` 会把 661 行 AGPL 全文当作 License 字段吐出来的原因。
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Jeff Liu Lab", email = "contact@jeffliulab.com" },
]
keywords = [
    "embodied-ai",
    "agent",
    "llm-tool-use",
    "object-standard",
    "vision-language-action",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# ⛔ 上界政策（2026-07-29 定，被咬两次之后）——**在你想给下面某一行加 `<N` 之前先读这段。**
#
# anima-zero 是发在 PyPI 上给别人装的**库**，不是自己部署的应用。这两者的规矩是**反的**：
#   · 应用 → 锁得越死越好（锁文件钉到具体版本号）
#   · 库   → 上界会变成**别人的**问题。你写 `pydantic<3`，而用户的项目需要 pydantic 3，
#            pip 就解不出来，他装不上你的包，而且**没法绕过，只能等你改**。
#
# 所以这里的规矩是：**只钉已经证明会坏的，不加投机性上界。**
#
# 已钉的两个不是破例，它们恰好符合这条：
#   · mcp  —— 代码 `from mcp.server.fastmcp import FastMCP`，import 的是**内部子模块**，
#             不是公开 API。mcp 2.0.0 把它挪走了。
#   · ruff —— 依赖它的**默认规则集**，而默认值是工具方随时会改的东西。0.16.0 放宽了默认集，
#             没人碰过的代码冒出 205 个问题。（在下面 optional-dependencies 的 dev 里）
#
# 两者的共同点**不是「框架大」，是「依赖了比公开契约更深的东西」**。这才是能预测会不会坏的信号。
# 按这个标准，下面九个（anthropic/openai/fastapi/uvicorn/pillow/pydantic/pydantic-settings/
# python-dotenv/httpx/langgraph）用的都是公开稳定的 API，**一个都不该钉**。
#
# 下次再红怎么办：就下次再钉。一次 CI 红 + 两行改动 ≈ 10 分钟，比给未来每个用户设一道墙便宜。
# ⚠️ 而且那次红是**有信息量的**——它告诉你上游改了接口。提前压掉这个信号，你只会更晚知道。
#
# 如果哪天觉得被打断得太烦：正确做法**不是往这里加上界**，而是给 CI 单独加一个约束文件
# （CI 装固定版本、发布出去的包照样宽松）。代价是要维护它，且会**推迟**你发现上游变化。
# 见 ROADMAP R10。
dependencies = [
    "anthropic>=0.69",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=10",
    "pydantic>=2.6",
    "pydantic-settings>=2.6",  # 中央配置 Settings(BaseSettings)：类型校验+env/.env 读取(v0.8 起;此前是 mcp 的传递依赖,直接 import 必须显式声明)
    "python-dotenv>=1.0",
    "httpx>=0.27",      # 世界客户端(RemoteWorld)直接用;之前仅靠 anthropic/fastapi 传递依赖,现显式声明
    # 官方 MCP SDK：大脑作 MCP host/client 连世界/服务（接口采标 MCP）。
    # ⛔ 上界是**必须的**，不是保守：mcp 2.0.0 把 `mcp.server.fastmcp` 挪走了，
    #    而 services/boardgame_engine/app.py 直接 import 它 —— CI 在没人改一行代码的情况下变红。
    #    这一行的注释原本就写着「先钉 v1.x」，但约束 `>=1.2` 根本没有钉：
    #    **意图写下来了、代码没有实现它**，而这种缺口只会在别人发版的那天暴露。
    #    要升 2.x 是一次单独的、要改代码的迁移，不该由一次 `pip install` 顺手完成。
    "mcp>=1.2,<2",
    "langgraph>=1.0",   # 主循环骨架(StateGraph);节点内脏仍是自有 LLM 层/MCP 桥,不用 LangChain 抽象
]

[project.scripts]
# Without this, installing the package gives you a library and no way to start anything.
# 没有这一段，装完这个包得到的是一个库、以及"无从启动任何东西"。
anima = "anima.cli:main"

[project.optional-dependencies]
dev = [
    # Upper bound on purpose: an unpinned linter means the rule set is whatever the tool
    # ships today, and CI turns red without a code change. Dependabot raises this, and the
    # raise is reviewed like any other change.
    # 有意加上界：linter 不钉版本，等于规则集是"工具今天发的那个"，CI 会在代码没动的情况下变红。
    # 由 dependabot 来提升，而提升本身像任何改动一样要过审。
    "ruff>=0.15,<0.17",
    "pytest>=8.0",      # 自动化回归测试(主循环/挂载/统一日志/链路)
]
# Chess rules, needed only to run the board-game engine service (services/boardgame_engine,
# port 8108) or the sim-chess world. The brain itself never touches chess logic — that is
# the whole point of the layering — so this stays out of the base install.
#
# It replaces python-chess (GPL-3.0), which was the single non-permissive dependency in the
# entire project. anima-chess lives in packages/ of this repository and is MIT.
#
# 棋规则，只有跑棋类引擎 service（services/boardgame_engine，:8108）或 sim-chess 世界才需要。
# 大脑自己从不碰棋类逻辑——分层的意义就在这里——所以它不进基础安装。
#
# 它替掉的是 python-chess（GPL-3.0），那是整个项目里**唯一**一个非宽松协议的依赖。
# anima-chess 就在本仓的 packages/ 下，MIT。
chess = ["anima-chess>=0.1"]

[project.urls]
Homepage = "https://github.com/jeffliulab/anima-zero"

# The pre-built web app travels with the package so a machine without node still gets an
# interface. Generated by `python scripts/build_ui.py`; gitignored, because it is a release
# artifact rather than source. ⚠️ Build it before building the wheel — see that script's
# header for why forgetting is silent.
# 预先构建好的网页随包分发，好让没有 node 的机器也有界面。由 `python scripts/build_ui.py` 生成；
# 不入库，因为它是发版产物不是源码。⚠️ 打 wheel 之前先构建它——忘了为什么是**静默**失败，见那个脚本的头。
[tool.setuptools.package-data]
# ⛔ "web/.build-time" must be listed explicitly: glob patterns like web/**/* do NOT
# match dotfiles, so the build stamp silently never entered the wheel (v1.1.0–v1.1.1
# shipped without it, and the staleness check it feeds was dead for pip users).
# After touching this, verify by unzipping a built wheel — this is precisely the
# failure mode that build logs do not show.
# ⛔ 点开头的文件必须显式列出：web/**/* 这类通配**匹配不到点文件**，构建时间戳因此从来没
# 进过 wheel（v1.1.0–v1.1.1 都没有，防界面过时那道守卫对 pip 用户形同虚设）。
# 改完这里必须解开 wheel 实地确认——这正是构建日志里看不出来的那类失效。
"anima.presentation" = ["web/**/*", "web/.build-time"]

# Version is read statically from src/_version.py — never duplicate it here.
# 版本号从 src/_version.py 静态读取——绝不在这里再写一份。
[tool.setuptools.dynamic]
version = { attr = "anima._version.__version__" }

# 扁平 src/ 映射成 anima 包(不建 src/anima);llm/ 是子包
[tool.setuptools]
package-dir = { "anima" = "src" }
packages = ["anima", "anima.core", "anima.clients", "anima.session", "anima.llm",
            "anima.presentation", "anima.examples"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"       # 把 .pytest_cache 收进 .cache/
testpaths = ["tests"]
pythonpath = ["."]                # 仓库根进 sys.path：services.boardgame_engine / src.* 等顶层 import 靠它

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".cache/ruff"         # 把 .ruff_cache 收进 .cache/

[tool.ruff.lint]
# ⛔ State the rule set instead of inheriting the tool's default-of-the-day.
#
# This was implicit until ruff 0.16.0, which widened its defaults — 205 findings appeared in
# code nobody had touched, and CI went red on main because a linter released a new version.
# A build that breaks on somebody else's release schedule is not telling you about your code.
#
# These four are ruff's historical defaults, which is what this project has in fact been held
# to all along. Widening the set is a decision to take deliberately, in its own commit, with
# the findings actually addressed — not something to inherit by upgrading.
#
# ⛔ 把规则集**写出来**，而不是继承工具"今天的默认值"。
#
# 在 ruff 0.16.0 之前这是隐式的；0.16.0 放宽了默认集——**没人碰过的代码里冒出 205 个问题**，
# main 上的 CI 因为"一个 linter 发了新版"而变红。一个会随别人发版节奏而挂掉的构建，
# 报的不是你代码的事。
#
# 下面这四个就是 ruff 的历史默认集，也正是这个项目一直以来实际被要求达到的标准。
# 要放宽规则集，那是一个**要专门去做的决定**：单独一个 commit、把问题真正改掉——
# 而不是靠升级顺带继承过来。
select = ["E4", "E7", "E9", "F"]
