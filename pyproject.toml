[build-system]
requires = ["setuptools>=77"]   # >=77: PEP 639 的 SPDX license 写法
build-backend = "setuptools.build_meta"

[project]
name = "anima"
# Single source of truth is src/_version.py (read statically, no import at build time).
# 版本号的单一来源是 src/_version.py（静态读取，构建期不 import）。
dynamic = ["version"]
description = "ANIMA — the brain of an embodied robot: an object standard + registry + a generic agent loop. Connects to one object at a time and operates it through vision-capable LLMs."
readme = "README.md"
# SPDX expression, not `{ file = "LICENSE" }` — the file form copies the entire licence
# text into the package metadata, which is why `pip show` used to print all 661 lines of
# the AGPL as the "License" field.
# 用 SPDX 表达式而不是 `{ file = "LICENSE" }`——文件形式会把整篇协议正文抄进包元数据，
# 这就是过去 `pip show` 会把 661 行 AGPL 全文当作 License 字段吐出来的原因。
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
    { name = "Jeff Liu Lab", email = "contact@jeffliulab.com" },
]
keywords = [
    "embodied-ai",
    "agent",
    "llm-tool-use",
    "object-standard",
    "vision-language-action",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=0.69",
    "openai>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=10",
    "pydantic>=2.6",
    "pydantic-settings>=2.6",  # 中央配置 Settings(BaseSettings)：类型校验+env/.env 读取(v0.8 起;此前是 mcp 的传递依赖,直接 import 必须显式声明)
    "python-dotenv>=1.0",
    "httpx>=0.27",      # 世界客户端(RemoteWorld)直接用;之前仅靠 anthropic/fastapi 传递依赖,现显式声明
    "mcp>=1.2",         # 官方 MCP SDK：大脑作 MCP host/client 连世界/服务(接口采标 MCP);先钉 v1.x
    "langgraph>=1.0",   # 主循环骨架(StateGraph);节点内脏仍是自有 LLM 层/MCP 桥,不用 LangChain 抽象
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",      # 自动化回归测试(主循环/挂载/统一日志/链路)
]
# Chess rules, needed only to run the board-game engine service (services/boardgame_engine,
# port 8108) or the sim-chess world. The brain itself never touches chess logic — that is
# the whole point of the layering — so this stays out of the base install.
#
# It replaces python-chess (GPL-3.0), which was the single non-permissive dependency in the
# entire project. anima-chess lives in packages/ of this repository and is MIT.
#
# 棋规则，只有跑棋类引擎 service（services/boardgame_engine，:8108）或 sim-chess 世界才需要。
# 大脑自己从不碰棋类逻辑——分层的意义就在这里——所以它不进基础安装。
#
# 它替掉的是 python-chess（GPL-3.0），那是整个项目里**唯一**一个非宽松协议的依赖。
# anima-chess 就在本仓的 packages/ 下，MIT。
chess = ["anima-chess>=0.1"]

[project.urls]
Homepage = "https://github.com/jeffliulab/anima-zero"

# Version is read statically from src/_version.py — never duplicate it here.
# 版本号从 src/_version.py 静态读取——绝不在这里再写一份。
[tool.setuptools.dynamic]
version = { attr = "anima._version.__version__" }

# 扁平 src/ 映射成 anima 包(不建 src/anima);llm/ 是子包
[tool.setuptools]
package-dir = { "anima" = "src" }
packages = ["anima", "anima.core", "anima.clients", "anima.session", "anima.llm",
            "anima.presentation",
            # 内置的演示世界随 wheel 分发——`pip install anima` 之后得有个去处，
            # 否则第一条命令就因为"你还没起一个世界"而失败。见 src/worlds/desk/world.py。
            "anima.worlds", "anima.worlds.desk"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"       # 把 .pytest_cache 收进 .cache/
testpaths = ["tests"]
pythonpath = ["."]                # 仓库根进 sys.path：services.boardgame_engine / src.* 等顶层 import 靠它

[tool.ruff]
line-length = 100
target-version = "py311"
cache-dir = ".cache/ruff"         # 把 .ruff_cache 收进 .cache/
# Submodules are separate repositories with their own lint setup — you don't lint
# someone else's repo from yours. / 子模块是独立的仓、有自己的 lint；不从本仓去管别人的仓。
exclude = ["world/sim-desk"]
