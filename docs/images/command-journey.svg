<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<!-- SVG-DESIGN-NOTES
Type: C 过程（+ D 量化：右侧对数频率轴）
Q0 一句话: 同一条指令穿过的这几层，**工作频率差了三四个数量级**——上面每步想一次，
   下面每秒跑五百次；这就是 System 2 / System 1 分工的物理含义，不是比喻。
Q1 几何映射: 纵轴 = 指令流向（从人话到力矩）；**右侧对数频率轴**把每层放在它真实的速率上，
   两端的括号直接量出 System 2 与 System 1 的速率鸿沟。层高按"这层有多少事"给，不等高。
Q2 DNA: 去掉标题也认得出——右边那条跨 4 个数量级的对数轴 + 底部绕回顶部的虚线闭环，
   是"慢思考指挥快反射、再看反馈"这件事独有的形状。
Q3 装饰删除: 无阴影、无渐变、无图例、无立体感；每个色块只有一条左侧色条表明归属。
Q4 直接标注: 代码位置和实测数字都贴在对应层内部，不另设图例。
Q5 Dark+双语: ⚠️ GitHub 的 markdown 会过滤内联 <svg>，只能用 <img> 加载，
   因此**不能**继承父页 CSS 变量——本图自带浅色底，当作一张印刷插图，深浅两种主题下都可读。
   标签全用英文（技术名词本来就是英文），中英两份 README 共用这一张，避免两份图走样。
-->
  <rect width="900" height="640" fill="#f7f8fa"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <!-- ════ 右侧：**真·对数**频率轴（几何承载"速率鸿沟"这个知识点）════
       每个数量级 105 px：0.1 Hz→y110、1→215、10→320、100→425、1000→530。
       ⚠️ 第一版这条轴的刻度是错的（0.1→10 跨两个数量级却和 10→100 一个数量级等高）——
          一张以对数轴为核心论据的图，轴画错比不画更糟。渲染核对时抓到，已按真值重排。 -->
  <line x1="742" y1="104" x2="742" y2="536" stroke="#9ca3af" stroke-width="1.2"/>
  <g font-size="11" fill="#6b7280" text-anchor="start">
    <line x1="737" y1="110" x2="747" y2="110" stroke="#9ca3af"/><text x="753" y="114">0.1 Hz</text>
    <line x1="737" y1="215" x2="747" y2="215" stroke="#9ca3af"/><text x="753" y="219">1 Hz</text>
    <line x1="737" y1="320" x2="747" y2="320" stroke="#9ca3af"/><text x="753" y="324">10 Hz</text>
    <line x1="737" y1="425" x2="747" y2="425" stroke="#9ca3af"/><text x="753" y="429">100 Hz</text>
    <line x1="737" y1="530" x2="747" y2="530" stroke="#9ca3af"/><text x="753" y="534">1000 Hz</text>
  </g>
  <text x="800" y="76" font-size="11.5" fill="#374151" text-anchor="middle" font-weight="600">how often it runs</text>

  <!-- 引线：把每一层接到它在轴上的**真实**位置（层的纵向位置按叙事排，轴按频率排，两者用引线连） -->
  <g stroke="#9ca3af" stroke-width="0.9" stroke-dasharray="2 3" fill="none">
    <path d="M714 132 L742 142"/>
    <path d="M696 373 L742 393"/>
    <path d="M696 447 L742 498"/>
  </g>
  <circle cx="742" cy="142" r="4.5" fill="#3b82f6"/>
  <circle cx="742" cy="393" r="4.5" fill="#f59e0b"/>
  <circle cx="742" cy="498" r="4.5" fill="#f59e0b"/>

  <!-- System 2 / System 1 括号：直接量出那道≈3.4 个数量级的鸿沟 -->
  <path d="M866 118 L874 118 L874 166 L866 166" fill="none" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="884" y="142" font-size="11.5" fill="#1d4ed8" font-weight="600"
        transform="rotate(90 884 142)" text-anchor="middle">System 2</text>
  <path d="M866 370 L874 370 L874 522 L866 522" fill="none" stroke="#b45309" stroke-width="1.4"/>
  <text x="884" y="446" font-size="11.5" fill="#b45309" font-weight="600"
        transform="rotate(90 884 446)" text-anchor="middle">System 1</text>
  <path d="M742 152 L742 383" stroke="#dc2626" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="734" y="270" font-size="11" fill="#dc2626" text-anchor="end"
        transform="rotate(-90 734 270)" style="dominant-baseline:middle">≈ 3.4 orders of magnitude</text>

  <!-- ════ 你说的那句话 ════ -->
  <rect x="60" y="20" width="360" height="36" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
  <text x="240" y="43" font-size="14" fill="#1e3a5f" text-anchor="middle">you say “go to the living room”</text>
  <text x="432" y="43" font-size="11.5" fill="#6b7280">— said exactly once</text>
  <line x1="240" y1="56" x2="240" y2="84" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ════ 大脑带（System 2）════ -->
  <rect x="52" y="86" width="660" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <rect x="52" y="86" width="4" height="92" rx="2" fill="#3b82f6"/>
  <text x="70" y="106" font-size="14" font-weight="700" fill="#1e3a5f">ANIMA — the brain</text>
  <text x="214" y="106" font-size="11.5" fill="#64748b">once per step · src/core/orchestrator.py</text>

  <g font-size="12" fill="#1f2937">
    <rect x="70" y="118" width="146" height="48" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="80" y="136" font-weight="600">① see</text>
    <text x="80" y="153" font-size="10.5" fill="#4b5563">frame + heading + lidar</text>

    <rect x="228" y="118" width="146" height="48" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="238" y="136" font-weight="600">② think</text>
    <text x="238" y="153" font-size="10.5" fill="#4b5563">the LLM picks a tool</text>

    <rect x="386" y="118" width="146" height="48" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="396" y="136" font-weight="600">③ gate</text>
    <text x="396" y="153" font-size="10.5" fill="#4b5563">deterministic, no LLM</text>

    <rect x="544" y="118" width="150" height="48" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="554" y="136" font-weight="600">④ act</text>
    <text x="554" y="153" font-size="10.5" fill="#4b5563">tools/call</text>
  </g>
  <path d="M216 142 L226 142 M374 142 L384 142 M532 142 L542 142" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ════ 协议边界 ════ -->
  <line x1="52" y1="196" x2="712" y2="196" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="240" y="182" width="284" height="28" rx="14" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="382" y="200" font-size="12" fill="#111827" text-anchor="middle" font-family="ui-monospace, monospace">
    MCP · turn_right(degrees=85)</text>
  <line x1="382" y1="210" x2="382" y2="236" stroke="#4b5563" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ════ 世界带（System 1）════ -->
  <rect x="52" y="238" width="660" height="318" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <rect x="52" y="238" width="4" height="318" rx="2" fill="#f59e0b"/>
  <text x="70" y="258" font-size="14" font-weight="700" fill="#78350f">the world — its own process</text>
  <text x="330" y="258" font-size="11.5" fill="#92400e">the brain can neither see nor reach inside</text>

  <!-- ⑤ 速度指令 -->
  <rect x="70" y="270" width="624" height="56" rx="7" fill="#ffffff" stroke="#fde68a"/>
  <text x="84" y="291" font-size="13" font-weight="600" fill="#1f2937">⑤ translate intent into a velocity command</text>
  <text x="84" y="311" font-size="11" fill="#4b5563">a humanoid standing still barely turns (measured 3.8° in 8 s), so the turn carries forward speed</text>
  <text x="676" y="299" font-size="12" fill="#92400e" text-anchor="end" font-family="ui-monospace, monospace">(0.3, 0, −0.8)</text>
  <line x1="382" y1="326" x2="382" y2="342" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ⑥ 策略 -->
  <rect x="70" y="344" width="624" height="56" rx="7" fill="#ffffff" stroke="#fde68a"/>
  <text x="84" y="365" font-size="13" font-weight="600" fill="#1f2937">⑥ learned gait policy</text>
  <text x="84" y="385" font-size="11" fill="#4b5563">480-dim observation (6 terms × 5 frames of history) → 29 joint targets · ONNX</text>
  <text x="676" y="373" font-size="12.5" fill="#b45309" text-anchor="end" font-weight="700">50 Hz</text>
  <line x1="382" y1="400" x2="382" y2="416" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ⑦⑧ 力矩与物理 -->
  <rect x="70" y="418" width="624" height="56" rx="7" fill="#ffffff" stroke="#fde68a"/>
  <text x="84" y="439" font-size="13" font-weight="600" fill="#1f2937">⑦ joint torques → ⑧ physics</text>
  <text x="84" y="459" font-size="11" fill="#4b5563">⛔ humanoid = implicit PD, quadruped = explicit PD — swap them and the robot falls instantly</text>
  <text x="676" y="447" font-size="12.5" fill="#b45309" text-anchor="end" font-weight="700">500 Hz</text>
  <line x1="382" y1="474" x2="382" y2="490" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- ⑨ 闭环收手 -->
  <rect x="70" y="492" width="624" height="50" rx="7" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="84" y="512" font-size="13" font-weight="600" fill="#1f2937">⑨ stop when the measured angle is reached — not when the clock says so</text>
  <text x="84" y="530" font-size="11" fill="#4b5563">a learned gait tracks only ~62% of the commanded yaw rate · measured: 92° turned, 0.64 m of drift</text>

  <!-- ════ 反馈闭环（虚线 = 状态回流）════ -->
  <path d="M694 517 L724 517 L724 600 L26 600 L26 132 L50 132"
        fill="none" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#af)"/>
  <rect x="196" y="590" width="440" height="22" rx="11" fill="#f7f8fa"/>
  <text x="415" y="605" font-size="12" fill="#c2410c" text-anchor="middle">
    new camera frame + what actually happened, reported truthfully</text>
</svg>
