<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<!-- SVG-DESIGN-NOTES
Type: A 结构
Q0 一句话: 世界是**另一个独立进程**，大脑只隔着 AWI 的四条通道看它、动它；
   人还可以**绕过大脑**直接拨弄世界——正因为绕得过去，才证明世界不是大脑的一部分。
Q1 几何映射: 三方横排；中间那束**四条并排的通道**是这张图的主体（AWI 就是这四条）。
   ⛔ 底部另画一条**离开通道束、直连世界**的旁路（人→世界），并把「只给人看」的三个端点
   挂在这条旁路上——通道与旁路在几何上分开，就是"给大脑的走 AWI、给人看的走带外"这条红线。
Q2 DNA: 去掉标题也认得出——两条互不相交的路径通向同一个世界，是这套架构独有的形状。
Q3 装饰删除: 无阴影、无渐变、无图例；框只有描边与淡填充。
Q4 直接标注: 每条通道的名字与 MCP 原语写在线上，不另设图例。
Q5 Dark+双语: ⚠️ GitHub markdown 过滤内联 <svg>，只能 <img> 加载、继承不了父页变量，
   故自带浅色底当印刷插图；标签全英文，中英两份 README 共用一张。
-->
  <rect width="900" height="470" fill="#f7f8fa"/>

  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ═══ 人 ═══ -->
  <rect x="24" y="120" width="112" height="86" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.3"/>
  <text x="80" y="150" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">you</text>
  <text x="80" y="171" font-size="10.5" fill="#4b5563" text-anchor="middle">open a session</text>
  <text x="80" y="187" font-size="10.5" fill="#4b5563" text-anchor="middle">watch · interrupt</text>

  <line x1="136" y1="150" x2="196" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#g)"/>

  <!-- ═══ 大脑 ═══ -->
  <rect x="198" y="60" width="212" height="208" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="304" y="86" font-size="15" font-weight="700" fill="#1e3a5f" text-anchor="middle">ANIMA — the brain</text>
  <text x="304" y="103" font-size="10.5" fill="#64748b" text-anchor="middle">MCP host · System 2</text>

  <g font-size="11.5" fill="#1f2937">
    <rect x="216" y="116" width="176" height="30" rx="6" fill="#fff" stroke="#bfdbfe"/>
    <text x="228" y="136">main loop · see → think → act</text>
    <rect x="216" y="152" width="176" height="30" rx="6" fill="#fff" stroke="#bfdbfe"/>
    <text x="228" y="172">two state registers</text>
    <rect x="216" y="188" width="176" height="30" rx="6" fill="#fff" stroke="#bfdbfe"/>
    <text x="228" y="208">safety gate (no LLM)</text>
    <rect x="216" y="224" width="176" height="30" rx="6" fill="#fff" stroke="#bfdbfe"/>
    <text x="228" y="244">sessions · unified log</text>
  </g>

  <!-- ═══ AWI 四条通道（本图主体）═══ -->
  <rect x="424" y="60" width="196" height="208" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.2"
        stroke-dasharray="4 3"/>
  <text x="522" y="80" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">AWI — over MCP</text>

  <g font-size="11">
    <rect x="428" y="96" width="196" height="14" fill="#faf5ff"/>
    <rect x="428" y="136" width="196" height="14" fill="#faf5ff"/>
    <rect x="428" y="176" width="196" height="14" fill="#faf5ff"/>
    <rect x="428" y="216" width="196" height="14" fill="#faf5ff"/>
    <line x1="412" y1="112" x2="630" y2="112" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#l)"/>
    <text x="432" y="106" fill="#5b21b6" font-weight="600">Tools</text>
    <text x="482" y="106" fill="#7c3aed">tools/call</text>

    <line x1="630" y1="152" x2="412" y2="152" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"
          marker-end="url(#l)" transform="translate(0,0)"/>
    <text x="432" y="146" fill="#5b21b6" font-weight="600">Resources</text>
    <text x="510" y="146" fill="#7c3aed">anima://observation</text>

    <line x1="630" y1="192" x2="412" y2="192" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"
          marker-end="url(#l)"/>
    <text x="432" y="186" fill="#5b21b6" font-weight="600">Prompts</text>
    <text x="498" y="186" fill="#7c3aed">the world's guidance</text>

    <line x1="630" y1="232" x2="412" y2="232" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6 4"
          marker-end="url(#l)"/>
    <text x="432" y="226" fill="#5b21b6" font-weight="600">Config</text>
    <text x="490" y="226" fill="#7c3aed">read-only for the brain</text>
  </g>
  <text x="522" y="256" font-size="10" fill="#6b7280" text-anchor="middle">solid = command out · dashed = state back</text>

  <!-- ═══ 世界 ═══ -->
  <rect x="632" y="60" width="240" height="208" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.4"/>
  <text x="752" y="86" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">the world</text>
  <text x="752" y="103" font-size="10.5" fill="#92400e" text-anchor="middle">a separate process · System 1</text>

  <g font-size="11.5" fill="#1f2937">
    <rect x="650" y="116" width="204" height="30" rx="6" fill="#fff" stroke="#fde68a"/>
    <text x="662" y="136">physics · the only ground truth</text>
    <rect x="650" y="152" width="204" height="30" rx="6" fill="#fff" stroke="#fde68a"/>
    <text x="662" y="172">a camera, and legs that walk</text>
    <rect x="650" y="188" width="204" height="30" rx="6" fill="#fff" stroke="#fde68a"/>
    <text x="662" y="208">house · chess · webcam · desk</text>
    <rect x="650" y="224" width="204" height="30" rx="6" fill="#fff" stroke="#fde68a"/>
    <text x="662" y="244">its own UI for humans</text>
  </g>

  <!-- ═══ 旁路：人绕过大脑直接摸世界（这张图的 DNA）═══ -->
  <path d="M80 206 L80 396 L740 396 L740 272" fill="none" stroke="#6b7280" stroke-width="1.6"
        stroke-dasharray="7 4" marker-end="url(#g)"/>
  <rect x="214" y="332" width="392" height="52" rx="8" fill="#f7f8fa" stroke="#d1d5db"/>
  <text x="228" y="352" font-size="12" font-weight="700" fill="#374151">out-of-band — never through MCP</text>
  <text x="228" y="371" font-size="11" fill="#4b5563" font-family="ui-monospace, monospace">
    /status  ⚠ ground truth · /stream  video · /health</text>

  <text x="96" y="300" font-size="11" fill="#374151">you can bypass the brain</text>
  <text x="96" y="316" font-size="11" fill="#374151">and poke the world directly</text>

  <text x="628" y="418" font-size="11.5" fill="#111827" text-anchor="middle" font-weight="600">
    ⛔ none of this ever reaches ANIMA — that is what makes the world independent</text>

  <!-- 底部一句总结 -->
  <line x1="24" y1="438" x2="876" y2="438" stroke="#e5e7eb"/>
  <text x="450" y="458" font-size="12" fill="#374151" text-anchor="middle">
    Brain and body never import each other. Swapping worlds means swapping a URL — the brain does not change.</text>
</svg>
