[build-system]
requires = ["setuptools>=77"]   # >=77: PEP 639 的 SPDX license 写法
build-backend = "setuptools.build_meta"

[project]
name = "camera-world"
version = "0.3.0"
description = "camera —— ANIMA 的一个独立『世界』：把真实摄像头画面通过 HTTP(AWI) 交给 ANIMA 看。零动作，只能看、不能操作。"
readme = "README.md"
license = "MIT"        # 与主仓一致（本仓 LICENSE）;世界是仓的一部分,不单独授权
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.6",
    "opencv-python>=4.6",
    "mcp>=1.2",         # 世界作 MCP server 暴露 AWI(tools/resources/prompts);挂在 /mcp
]

[tool.setuptools]
py-modules = ["server", "world", "capture", "v4l2_caps", "awi_mcp"]
