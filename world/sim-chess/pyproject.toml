[build-system]
requires = ["setuptools>=77"]   # >=77: PEP 639 的 SPDX license 写法
build-backend = "setuptools.build_meta"

[project]
name = "sim-chess"
version = "0.1.0"
description = "sim-chess —— ANIMA 的一个独立『世界』：仿真棋盘 + 内置棋手，通过标准 MCP 被观测和操作；对大脑只有 move、只给画面、不给真值"
readme = "README.md"
license = "MIT"        # 与主仓一致（本仓 LICENSE）;世界是仓的一部分,不单独授权
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pillow>=10",
    "pydantic>=2.6",
    "anima-chess>=0.1",   # 棋规则（本仓 packages/anima-chess，MIT；不再用 GPL 的 python-chess）
    "mcp>=1.2",         # 世界作 MCP server 暴露 AWI(tools/resources/prompts);挂在 /mcp
]

[tool.setuptools]
py-modules = ["server", "world", "render", "awi_mcp"]
