# CI — the house rules, enforced on every push.
#
# Deliberately ONE job on ONE Python version: a check suite that finishes in a minute
# is a check suite people actually read. Add a matrix when someone reports a real
# compatibility problem, not before.
#
# CI —— 每次推送都强制执行的项目规矩。
#
# 有意只用一个 job、一个 Python 版本：一分钟跑完的检查才会有人看。
# 等真有人报了兼容性问题再加矩阵，不要提前加。
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  python:
    name: Python checks / Python 侧检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # check_readme.py inspects git-tracked content / 按 git 内容查图片

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # anima-chess lives in this repository and is not on PyPI yet, so it has to be
      # installed from the working tree before the dependency can resolve. Remove this step
      # once it is published alongside anima.
      # anima-chess 就在本仓里、暂时不在 PyPI 上，所以要先从工作区装上，那条依赖才解析得到。
      # 等它跟 anima 一起发布之后，这一步就可以删掉。
      - name: Install the local rules library / 先装本仓的规则库
        run: pip install -e ./packages/anima-chess

      - name: Install / 安装
        run: pip install -e ".[dev]"

      - name: Lint (ruff) / 代码风格
        run: ruff check .

      - name: Rules library tests / 规则库自己的测试
        run: pytest -q packages/anima-chess/tests

      - name: Tests / 测试
        run: pytest -q

      # The four house rules that used to live only in a maintainer's private notes.
      # 那四条原先只写在维护者私人笔记里的规矩。
      - name: Self-checks / 项目自检
        run: python scripts/selfcheck.py

      # On a release tag, additionally assert tag == __version__ == CHANGELOG top entry.
      # 打 release tag 时，额外校验 tag == __version__ == CHANGELOG 顶栏。
      - name: Version consistency on tag / 封版三处版本号一致
        if: github.ref_type == 'tag'
        run: python scripts/selfcheck.py --tag "${{ github.ref_name }}"

      # Guards against the "looks fine locally, broken image on GitHub" failure mode.
      # 防的是「本地看得见、GitHub 上裂图」那种翻车。
      - name: README links and images / README 链接与图片
        run: python docs/check_readme.py

  frontend:
    name: Frontend checks / 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The wheel check at the bottom of this job runs python. Ask for it explicitly rather
      # than relying on whatever the runner image happens to preinstall — the alternative is
      # a build that breaks the day the image changes, in a job nobody thinks of as Python.
      # 本 job 末尾那步 wheel 校验要跑 python。显式装一个，别赌 runner 镜像里碰巧预装的那个
      # ——否则镜像哪天一变，这个"没人当成 Python job"的地方就会莫名其妙地红。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install / 安装
        run: npm ci

      # ⛔ Runs before typecheck on purpose: `lib/locales.generated.ts` is committed, and this
      # is what catches it being out of date with `locales/`. Stale generated code would
      # otherwise typecheck and build perfectly while shipping the wrong strings — the same
      # silent-stale-artefact failure this repository has hit twice before.
      # It also holds the claim this whole design rests on: dropping a JSON into `locales/`
      # adds a language without touching any logic.
      # ⛔ 有意排在 typecheck 之前：`lib/locales.generated.ts` 是**入库**的，而这一步就是抓它
      # 与 `locales/` 对不上的那道闸。生成物过时的话，类型检查和构建都会**完美通过**，
      # 只是发出去的词条是错的——这个仓已经吃过两次这种"静默用旧产物"的亏。
      # 它同时守着整套设计赖以成立的那个主张：往 `locales/` 丢一个 JSON 就能加一门语言、不碰任何逻辑。
      - name: Locale catalogues / 词条守卫
        run: npm run check:locales

      - name: Typecheck / 类型检查
        run: npm run typecheck

      - name: Build / 构建
        run: npm run build

      # The static export is what the Python wheel carries, so a break here would only
      # surface at release time — when the wheel silently ships whatever copy was lying
      # around. Checking it on every push is what stops that from being a release-day
      # discovery. / 静态导出是 Python wheel 会带走的那份，所以它坏了只会在**发版时**才暴露
      # ——那时 wheel 会静默地把碰巧留着的旧副本发出去。每次推送都验一遍，才不会变成发版当天的发现。
      - name: Static export (what ships in the wheel) / 静态导出（随 wheel 分发的那份）
        run: npm run build:static

      - name: The export must actually contain a page / 导出产物里必须真有页面
        run: test -f out/index.html && test -f out/awi.html

      # A release wheel ships whatever happens to sit in src/presentation/web/ — and
      # forgetting build_ui.py before `python -m build` is silent (v1.1.1 nearly shipped
      # without the Japanese UI for exactly this reason). So on every push: place the
      # export where the package carries it, build the wheel, and prove that both the
      # page and the .build-time stamp really made it inside. The stamp check matters
      # because package-data globs do not match dotfiles — the failure this guards
      # against is invisible in build logs.
      # 发版 wheel 会把 src/presentation/web/ 里碰巧留着的那份发出去，而忘了跑 build_ui.py
      # 是静默的（v1.1.1 就差点因此发出一份缺日文的界面）。所以每次推送都真跑一遍：
      # 放导出物、打 wheel、断言页面和 .build-time 时间戳都在包里。时间戳必须单查，
      # 因为 package-data 通配匹配不到点文件——这道失效在构建日志里是看不见的。
      - name: The wheel carries the fresh UI and its stamp / wheel 真带上新界面与时间戳
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/build_ui.py
          python3 -m pip install --quiet build
          python3 -m build --wheel -o /tmp/wheelcheck
          python3 - <<'EOF'
          import glob, zipfile
          w = glob.glob('/tmp/wheelcheck/*.whl')[0]
          names = zipfile.ZipFile(w).namelist()
          assert 'anima/presentation/web/index.html' in names, 'wheel has no web page'
          assert 'anima/presentation/web/.build-time' in names, 'wheel lost the build stamp'
          print('wheel carries the fresh UI and its build stamp')
          EOF
